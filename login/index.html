<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Access</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .login-container h2 { margin-top: 0; color: #333; }
        
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1a252f; }

        #message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
            font-weight: bold;
        }

        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .hidden { display: none !important; }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2c3e50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 视频目录样式 */
        .directory-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 1000px;
            align-self: flex-start;
            margin-top: 40px;
        }

        .directory-container h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-top: 20px;
        }
        
        .video-title {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eaeaea;
            font-weight: 600;
            color: #333;
        }
        
        /* YouTube 播放器容器，确保 16:9 比例 */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 登录界面 -->
    <div id="login-section" class="login-container">
        <h2>VIP 登录</h2>
        <input type="text" id="email-input" placeholder="请输入VIP账户或邮箱" autocomplete="off">
        <button id="login-btn">验证身份</button>
        <div id="message"></div>
        <div id="spinner" class="spinner hidden"></div>
    </div>

    <!-- 视频目录界面 -->
    <div id="directory-section" class="directory-container hidden">
        <h2>
            VIP 专属视频目录
            <span style="font-size: 14px; font-weight: normal; color: #666;" id="welcome-text"></span>
        </h2>
        
        <!-- 视频一：纯净 YouTube API 版 -->
        <div class="video-card">
            <div class="video-title">Cooking (2026-09-03)</div>
            <div class="video-wrapper">
                <!-- YouTube API 会自动将这个 div 替换为带原生控件的 iframe -->
                <div id="youtube-player-1"></div>
            </div>
        </div>

    </div>

    <!-- 引入 YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const loginBtn = document.getElementById('login-btn');
        const emailInput = document.getElementById('email-input');
        const messageDiv = document.getElementById('message');
        const spinner = document.getElementById('spinner');
        const loginSection = document.getElementById('login-section');
        const directorySection = document.getElementById('directory-section');
        const welcomeText = document.getElementById('welcome-text');

        // 切换到目录的函数
        function showDirectory(userName) {
            loginSection.classList.add('hidden');
            directorySection.classList.remove('hidden');
            document.body.style.alignItems = 'flex-start';
            welcomeText.innerText = `当前登录: ${userName}`;
            initVideoPlayer(); 
        }

        loginBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();

            if (email === 'dev') {
                showDirectory('dev (开发者)');
            } 
            else if (email === '488540035@qq.com') {
                messageDiv.innerHTML = '欢迎您，VIP Jaffee';
                messageDiv.className = 'success';
                
                emailInput.classList.add('hidden');
                loginBtn.classList.add('hidden');
                spinner.classList.remove('hidden');

                setTimeout(() => {
                    showDirectory('VIP Jaffee');
                }, 5000);
            } 
            else {
                messageDiv.innerHTML = 'access denied<br>权阶等级过低，请联系管理员后再试。';
                messageDiv.className = 'error';
            }
        });

        emailInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loginBtn.click();
        });

        // ================= YouTube API 核心逻辑 =================
        let player;
        const progressKey = 'vip_video_progress_youtube_native_20260903';
        let progressTimer;

        function initVideoPlayer() {
            // 如果 YouTube API 未准备好，或播放器已初始化，则跳过
            if (typeof YT === 'undefined' || typeof YT.Player === 'undefined' || player) return;

            player = new YT.Player('youtube-player-1', {
                videoId: 'j_RxwcT_DXg', // 你的视频 ID
                playerVars: {
                    'playsinline': 1,
                    'rel': 0,           // 播放结束后不显示无关推荐视频
                    'modestbranding': 1 // 隐藏右下角 YouTube Logo
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 播放器准备就绪时触发
        function onPlayerReady(event) {
            const savedTime = localStorage.getItem(progressKey);
            if (savedTime && parseFloat(savedTime) > 0) {
                player.seekTo(parseFloat(savedTime), true);
            }
        }

        // 播放状态改变时触发
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                // 每秒保存一次进度
                progressTimer = setInterval(() => {
                    localStorage.setItem(progressKey, player.getCurrentTime());
                }, 1000);
            } else {
                // 暂停或缓冲时停止保存进度
                clearInterval(progressTimer);
                
                // 如果播放结束，清除记录
                if (event.data === YT.PlayerState.ENDED) {
                    localStorage.removeItem(progressKey);
                }
            }
        }
    </script>
</body>
</html>
