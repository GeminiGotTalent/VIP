<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Video Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; /* 播放页使用暗色背景更沉浸 */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .top-bar {
            width: 100%; max-width: 1000px;
            display: flex; justify-content: flex-start;
            margin-bottom: 20px;
        }

        .back-btn {
            background: rgba(255,255,255,0.1); color: white;
            text-decoration: none; padding: 10px 20px; border-radius: 6px;
            font-size: 14px; transition: background 0.2s; border: 1px solid rgba(255,255,255,0.2);
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .player-container {
            width: 100%; max-width: 1000px;
            background: #111; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .plyr { aspect-ratio: 16 / 9; }
        :root { --plyr-color-main: #2c3e50; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../index.html" class="back-btn">← 返回列表</a> 
    </div>

    <div class="player-container">
        <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="j_RxwcT_DXg"></div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 获取当前视频的ID，用于隔离不同视频的播放进度
            const videoId = document.getElementById('player').getAttribute('data-plyr-embed-id');
            const progressKey = `vip_video_progress_${videoId}`;

            const player = new Plyr('#player', {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'mute', 'volume',
                    'captions', 'settings', 'pip', 'airplay', 'fullscreen'
                ],
                settings: ['captions', 'quality', 'speed'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
                i18n: { 
                    speed: '倍速', normal: '正常', 
                    captions: '字幕', quality: '画质', disabled: '关闭' 
                },
                youtube: { 
                    noCookie: false, rel: 0, showinfo: 0, 
                    iv_load_policy: 3, modestbranding: 1, cc_load_policy: 1 
                }
            });

            player.on('ready', () => {
                const savedTime = localStorage.getItem(progressKey);
                if (savedTime && parseFloat(savedTime) > 0) {
                    player.currentTime = parseFloat(savedTime);
                }
            });

            player.on('timeupdate', () => {
                if (player.playing && player.currentTime > 0) {
                    localStorage.setItem(progressKey, player.currentTime);
                }
            });
            
            player.on('ended', () => {
                localStorage.removeItem(progressKey);
            });
        });
    </script>
</body>
</html>
