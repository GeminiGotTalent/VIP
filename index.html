<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoucom - 注册已关闭</title>
    <style>
        :root {
            --primary-color: #2c3e50;   /* 深蓝主题色 */
            --accent-color: #d4af37;    /* 金色点缀 */
            --bg-color: #f4f6f8;        /* 页面背景 */
            --card-bg: #ffffff;         /* 卡片背景 */
            --text-color: #333333;      /* 主文本色 */
            --muted-color: #888888;     /* 辅助文本色 */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            /* 让内容在整个屏幕垂直和水平居中 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            border-top: 6px solid var(--accent-color);
            text-align: center;
            max-width: 450px;
            width: 85%;
            /* 添加一个温和的入场动画 */
            animation: fadeIn 0.6s ease-out;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
            user-select: none;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6em;
            margin-top: 0;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .status-text {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 30px;
        }

        .notice-small {
            font-size: 0.85em;
            color: var(--muted-color);
            background-color: #f9f9f9;
            padding: 10px 18px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid #eee;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85em;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        /* 动画关键帧 */
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🔒</div>
        <h1>感谢您对 Zoucom 的关注！</h1>
        <div class="status-text">注册入口已暂时关闭。</div>
        
        <!-- 这里是你要求的小字提示 -->
        <div class="notice-small">✨ 存量用户不受影响</div>
    </div>

    <div class="footer">
        &copy; 2026 Zoucom. 版权所有
    </div>

</body>
</html>
