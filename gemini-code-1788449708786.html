<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Access</title>
    <!-- 引入 Plyr 播放器样式 -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .login-container h2 { margin-top: 0; color: #333; }
        
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1a252f; }

        #message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
            font-weight: bold;
        }

        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .hidden { display: none !important; }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2c3e50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 视频目录样式 */
        .directory-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 1000px;
            align-self: flex-start;
            margin-top: 40px;
        }

        .directory-container h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-top: 20px;
        }
        
        .video-title {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eaeaea;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- 登录界面 -->
    <div id="login-section" class="login-container">
        <h2>VIP 登录</h2>
        <input type="text" id="email-input" placeholder="请输入VIP账户或邮箱" autocomplete="off">
        <button id="login-btn">验证身份</button>
        <div id="message"></div>
        <div id="spinner" class="spinner hidden"></div>
    </div>

    <!-- 视频目录界面 (默认隐藏) -->
    <div id="directory-section" class="directory-container hidden">
        <h2>
            VIP 专属视频目录
            <span style="font-size: 14px; font-weight: normal; color: #666;" id="welcome-text"></span>
        </h2>
        
        <!-- 视频一：已集成 Plyr 和进度记忆 -->
        <div class="video-card">
            <div class="video-title">烹饪教学 (2026-09-03)</div>
            <!-- 播放器容器 -->
            <video id="player-1" playsinline controls data-poster="">
                <!-- 注意这里修正了 tag 为 download -->
                <source src="https://github.com/GeminiGotTalent/VIP/releases/download/v0.0.1/20260903_cooking.mp4" type="video/mp4" />
            </video>
        </div>

    </div>

    <!-- 引入 Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const loginBtn = document.getElementById('login-btn');
        const emailInput = document.getElementById('email-input');
        const messageDiv = document.getElementById('message');
        const spinner = document.getElementById('spinner');
        const loginSection = document.getElementById('login-section');
        const directorySection = document.getElementById('directory-section');
        const welcomeText = document.getElementById('welcome-text');

        // 切换到目录的函数
        function showDirectory(userName) {
            loginSection.classList.add('hidden');
            directorySection.classList.remove('hidden');
            document.body.style.alignItems = 'flex-start';
            welcomeText.innerText = `当前登录: ${userName}`;
            initVideoPlayer(); // 界面显示后再初始化播放器
        }

        loginBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();

            if (email === 'dev') {
                // 开发者秒进模式
                showDirectory('dev (开发者)');
            } 
            else if (email === '488540035@qq.com') {
                // 正常 VIP 模式
                messageDiv.innerHTML = '欢迎您，VIP coffee';
                messageDiv.className = 'success';
                
                emailInput.classList.add('hidden');
                loginBtn.classList.add('hidden');
                spinner.classList.remove('hidden');

                setTimeout(() => {
                    showDirectory('VIP coffee');
                }, 5000);
            } 
            else {
                // 验证失败
                messageDiv.innerHTML = 'access denied<br>权阶等级过低，请联系管理员后再试。';
                messageDiv.className = 'error';
            }
        });

        emailInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });

        // 播放器初始化与进度记忆功能
        let playerInitialized = false;
        function initVideoPlayer() {
            if (playerInitialized) return;
            
            // 1. 初始化 Plyr 播放器，配置包含倍速
            const player = new Plyr('#player-1', {
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
                i18n: { speed: '倍速', normal: '正常' }
            });

            // 2. 进度记忆逻辑
            const videoElement = document.getElementById('player-1');
            const progressKey = 'vip_video_progress_20260903'; // 本地存储 Key

            // 元数据加载完毕后，跳到上次保存的进度
            videoElement.addEventListener('loadedmetadata', () => {
                const savedTime = localStorage.getItem(progressKey);
                if (savedTime && parseFloat(savedTime) > 0) {
                    videoElement.currentTime = parseFloat(savedTime);
                }
            });

            // 播放过程中不断保存进度（节流，防止过于频繁，这里利用 timeupdate 事件自身频率）
            videoElement.addEventListener('timeupdate', () => {
                // 仅当视频正在播放时才记录，避免刷新导致重置
                if (!videoElement.paused) {
                    localStorage.setItem(progressKey, videoElement.currentTime);
                }
            });
            
            // 播放结束时清理进度记录（可选）
            videoElement.addEventListener('ended', () => {
                localStorage.removeItem(progressKey);
            });

            playerInitialized = true;
        }
    </script>
</body>
</html>
